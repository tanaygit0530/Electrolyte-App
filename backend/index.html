<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrolyte - Invoice Generation</title>
    <style>
        :root {
            --primary: #c41e3a;
            --primary-dark: #a01830;
            --secondary: #2c3e50;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333;
            --border: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
        }

        .header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .products-section {
            margin-top: 30px;
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            background: #fff;
        }

        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .product-row {
            display: grid;
            grid-template-columns: 3fr 1fr 1.5fr 0.5fr;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-add {
            background: var(--secondary);
            color: white;
            padding: 8px 15px;
            font-size: 12px;
        }

        .btn-remove {
            background: #ff4d4d;
            color: white;
            padding: 8px;
            font-size: 12px;
        }

        .btn-view {
            background: var(--primary);
            color: white;
            width: 100%;
            margin-top: 30px;
            font-size: 16px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .summary-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .summary-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Electrolyte solutions</h1>
            <p>Invoice Generation System</p>
        </div>

        <form id="invoiceForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" name="customerName" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Customer Email</label>
                    <input type="email" name="customerEmail" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Warranty Type</label>
                    <select name="warrantyType">
                        <option value="OW">Out of Warranty (OW)</option>
                        <option value="IW">In Warranty (IW)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Brand</label>
                    <input type="text" name="brand" value="Atomberg" required>
                </div>
                <div class="form-group">
                    <label>Serial Number</label>
                    <input type="text" name="serialNumber" required placeholder="SN12345678">
                </div>
                <div class="form-group">
                    <label>Case ID</label>
                    <input type="text" name="caseId" required placeholder="C-98765">
                </div>
                <div class="form-group">
                    <label>Prepared By</label>
                    <input type="text" name="preparedBy" required placeholder="Technician Name">
                </div>
                <div class="form-group">
                    <label>Service Charge (Rs.)</label>
                    <input type="number" name="serviceCharge" value="0" required>
                </div>
            </div>

            <div class="products-section">
                <div class="products-header">
                    <label>Products / Spares</label>
                    <button type="button" class="btn btn-add" onclick="addProduct()">+ Add Item</button>
                </div>
                <div id="productList">
                    <!-- Product rows will be added here -->
                </div>
            </div>

            <button type="button" class="btn btn-view" onclick="showSummary()">View Summary & Generate</button>
            <div id="loader" class="loading">Processing... Generating PDF & Sending Email...</div>
        </form>
    </div>

    <!-- Summary Modal -->
    <div id="summaryModal" class="summary-overlay">
        <div class="summary-card">
            <h2 style="color: var(--primary); margin-top: 0;">Confirm Details</h2>
            <div id="summaryContent" style="margin-bottom: 25px; line-height: 1.8;">
                <!-- Summary content here -->
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="flex: 1; background: #999; color: white;" onclick="closeSummary()">Edit</button>
                <button class="btn" style="flex: 2; background: var(--primary); color: white;" onclick="submitInvoice()">Confirm & Send Invoice</button>
            </div>
        </div>
    </div>

    <script>
        let productCount = 0;

        function addProduct() {
            const list = document.getElementById('productList');
            const row = document.createElement('div');
            row.className = 'product-row';
            row.id = `prod-${productCount}`;
            row.innerHTML = `
                <input type="text" placeholder="Product Name" class="prod-name" required>
                <input type="number" placeholder="Qty" class="prod-qty" value="1" required>
                <input type="number" placeholder="Rate" class="prod-rate" required>
                <button type="button" class="btn btn-remove" onclick="removeProduct(${productCount})">×</button>
            `;
            list.appendChild(row);
            productCount++;
        }

        function removeProduct(id) {
            const row = document.getElementById(`prod-${id}`);
            row.remove();
        }

        // Add first product by default
        addProduct();

        function showSummary() {
            const form = document.getElementById('invoiceForm');
            if(!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            
            const products = [];
            document.querySelectorAll('.product-row').forEach(row => {
                products.push({
                    name: row.querySelector('.prod-name').value,
                    qty: row.querySelector('.prod-qty').value,
                    rate: row.querySelector('.prod-rate').value
                });
            });

            if(products.length === 0) {
                alert("Please add at least one product.");
                return;
            }

            let summaryHtml = `
                <p><strong>Customer:</strong> ${data.customerName}</p>
                <p><strong>Email:</strong> ${data.customerEmail}</p>
                <p><strong>Warranty:</strong> ${data.warrantyType}</p>
                <p><strong>Brand:</strong> ${data.brand}</p>
                <p><strong>Serial:</strong> ${data.serialNumber}</p>
                <p><strong>Service Charge:</strong> Rs. ${data.serviceCharge}</p>
                <div style="margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px;">
                    <strong>Items:</strong><br>
                    ${products.map(p => `${p.name} - ${p.qty} x ${p.rate}`).join('<br>')}
                </div>
            `;

            document.getElementById('summaryContent').innerHTML = summaryHtml;
            document.getElementById('summaryModal').style.display = 'flex';
            
            window.currentInvoiceData = {...data, products};
        }

        function closeSummary() {
            document.getElementById('summaryModal').style.display = 'none';
        }

        async function submitInvoice() {
            closeSummary();
            document.getElementById('loader').style.display = 'block';
            document.querySelector('.btn-view').disabled = true;

            try {
                const response = await fetch('http://localhost:5001/invoice', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(window.currentInvoiceData)
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Success! Invoice ' + result.invoiceNumber + ' generated and emailed.');
                    window.location.reload();
                } else {
                    alert('Error: ' + (result.error || 'Failed to generate invoice'));
                }
            } catch (err) {
                console.error(err);
                alert('Connection Error: Is the backend running?');
            } finally {
                document.getElementById('loader').style.display = 'none';
                document.querySelector('.btn-view').disabled = false;
            }
        }
    </script>
</body>
</html>
